[project]
name = "csgo-insight-agent-backend"
version = "2.6.0"
description = "Python backend runtime for CSGO Insight Agent"
requires-python = "==3.12.*"
dependencies = [
    "aiosqlite==0.22.1",
    "cramjam==2.11.0",
    "cryptography==50.0.0",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "obs-websocket-py==1.0",
    "openai==2.41.0",
    "packaging==26.2",
    "pillow==12.2.0",
    "pydantic==2.13.4",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.30",
    "uvicorn==0.49.0",
    "watchdog==6.0.0",
    "websockets==16.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
[tool.uv]
package = false
required-version = ">=0.11.8,<0.13"
