name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 2.6.0)"
        required: true
        type: string
      update_mode:
        description: "Updater mode: normal prompts users, force auto-installs"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - force
      deploy:
        description: "Publish the installer + updater manifests to Cloudflare R2"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONPATH: backend
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri
            tools/demo-cosmetic-rewriter

      - uses: ./.github/actions/build-csgo-extractor

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $ver = ($env:INPUT_VERSION -replace '^[vV]', '').Trim()
          } else {
            $ver = ($env:REF_NAME -replace '^[vV]', '').Trim()
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $ver"
          }
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release version $ver"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend test dependencies
        run: uv sync --frozen

      - name: Verify CS:GO demo extractor runtime
        run: uv run --frozen python -m app.demoparser_runtime

      - name: Run backend tests
        run: uv run --frozen python -m pytest backend/tests -q

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Check Rust formatting
        working-directory: frontend/src-tauri
        run: cargo fmt --check

      - name: Run Rust lints
        working-directory: frontend/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --locked

      - name: Import Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            Write-Host "WINDOWS_PFX_BASE64 is not configured; producing an unsigned installer"
            exit 0
          }
          if (-not $env:WINDOWS_PFX_PASSWORD) { throw "WINDOWS_PFX_PASSWORD is required when WINDOWS_PFX_BASE64 is configured" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "csgo-insight-agent-code-signing.pfx"
          try {
            $encoded = $env:WINDOWS_PFX_BASE64 -replace '-----BEGIN [^-]+-----', '' -replace '-----END [^-]+-----', '' -replace '\s', ''
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))
            $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $certificate) { throw "The imported PFX did not contain a code-signing certificate with a private key" }
            "CSGO_INSIGHT_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $conf = Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($conf.bundle.createUpdaterArtifacts -and -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "tauri.conf.json enables bundle.createUpdaterArtifacts but TAURI_SIGNING_PRIVATE_KEY is not configured. Add the secret, or set createUpdaterArtifacts=false and remove plugins.updater to build without update signing."
          }

      - name: Build Tauri desktop installer
        shell: pwsh
        run: |
          $env:CSGO_INSIGHT_REFRESH_PYTHON = "1"
          Push-Location frontend
          try {
            pnpm.cmd run desktop:build:ver -- $env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { throw "Tauri build failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Verify bundled Python runtime
        shell: pwsh
        run: |
          $resources = (Resolve-Path "frontend/src-tauri/bundle-resources").Path
          $py = Join-Path $resources "python/python.exe"
          $backend = Join-Path $resources "backend"
          $extractor = Join-Path $resources "tools\csgo-demo-extract\csgo-demo-extract.exe"
          if (-not (Test-Path -LiteralPath $py)) { throw "Bundled python.exe not found" }
          if (-not (Test-Path -LiteralPath $extractor)) { throw "Bundled csgo-demo-extract.exe not found" }
          $env:PYTHONNOUSERSITE = "1"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & $py -c "import sys; sys.path.insert(0, sys.argv[1]); import app.main, demoparser2, fastapi, importlib.util as u, openai, PIL, uvicorn; from app.demoparser_runtime import require_demoparser_runtime; report = require_demoparser_runtime(); assert report['ready']; assert u.find_spec('numpy') is None; assert u.find_spec('pandas') is None; assert u.find_spec('polars') is None; assert u.find_spec('pyarrow') is None; print('runtime-ok', report['installed_version'])" $backend
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime verification failed: $LASTEXITCODE" }
          $bundledVersion = (Get-Content (Join-Path $backend "app/release_version.txt") -Raw).Trim()
          if ($bundledVersion -ne $env:RELEASE_VERSION) {
            throw "Bundled backend version mismatch: expected $($env:RELEASE_VERSION), got $bundledVersion"
          }

      - name: Report bundled runtime size
        shell: pwsh
        run: ./packaging/windows/report-runtime-size.ps1 -Root "frontend/src-tauri/bundle-resources" -OutputPath "dist/runtime-size-report.json" -BudgetMiB 120

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath "frontend/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $installer = $artifacts | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer not found" }
          $installerMiB = $installer.Length / 1MB
          Write-Host ("Installer size: {0:N2} MiB" -f $installerMiB)
          if ($installerMiB -gt 45) { throw ("Installer exceeds 45 MiB budget: {0:N2} MiB" -f $installerMiB) }
          $appExe = Get-Item "frontend/src-tauri/target/release/cs2-insight-agent-desktop.exe"
          if ($env:CSGO_INSIGHT_WINDOWS_CERTIFICATE_THUMBPRINT) {
            $expectedThumbprint = $env:CSGO_INSIGHT_WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', ''
            foreach ($artifact in @($appExe, $installer)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
              if ($signature.Status -ne 'Valid') { throw "Authenticode validation failed for $($artifact.Name): $($signature.Status)" }
              if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
                throw "Unexpected signing certificate for $($artifact.Name): $($signature.SignerCertificate.Thumbprint)"
              }
            }
          }
          $resourceBytes = (Get-ChildItem "frontend/src-tauri/bundle-resources" -Recurse -File | Measure-Object Length -Sum).Sum
          $installedMiB = ($appExe.Length + $resourceBytes) / 1MB
          Write-Host ("Estimated installed size: {0:N2} MiB" -f $installedMiB)
          if ($installedMiB -gt 120) { throw ("Installed footprint exceeds 120 MiB budget: {0:N2} MiB" -f $installedMiB) }
          $sums = $artifacts | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $_.Name
          }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) "SHA256SUMS"), $sums, [Text.UTF8Encoding]::new($false))

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.RELEASE_VERSION }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
            dist/runtime-size-report.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
            dist/runtime-size-report.json
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 部署阶段：把 NSIS 安装包 + Tauri updater 清单（latest.json / latest.yml）
  # 推到 Cloudflare R2，供客户端增量更新使用。GitHub Release 保留人工下载通道。
  deploy:
    name: Deploy updater channel
    needs: release
    if: ${{ needs.release.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-7920152f7eff45c19b5a1750e55acd42.r2.dev' }}/latest.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deployment dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ needs.release.outputs.version }}

      - name: Resolve deployment configuration
        id: r2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ENDPOINT}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::R2 credentials are not configured; skipping updater deployment. Set the R2_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish installer and updater manifests to R2
        if: steps.r2.outputs.enabled == 'true'
        working-directory: frontend
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'cs-demo-agent' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          UPDATE_MODE: ${{ inputs.update_mode || 'normal' }}
          RELEASE_NOTES: "CSGO Insight Agent ${{ needs.release.outputs.version }}"
        run: pnpm run deploy:r2

      - name: Verify updater manifest
        if: steps.r2.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-7920152f7eff45c19b5a1750e55acd42.r2.dev' }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL "$BASE_URL/latest.json" -o latest.json; then break; fi
            echo "manifest not visible yet (attempt ${attempt}); retrying in 10s"
            sleep 10
          done
          jq -e --arg v "$VERSION" '.version == $v and (.platforms["windows-x86_64"].url | length) > 0' latest.json > /dev/null
          {
            echo "### Updater channel deployed"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Manifest: ${BASE_URL}/latest.json"
            echo "- Installer: $(jq -r '.platforms["windows-x86_64"].url' latest.json)"
          } >> "$GITHUB_STEP_SUMMARY"
