name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "asset/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "asset/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  extractor:
    name: CS:GO extractor
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-csgo-extractor

      - uses: actions/upload-artifact@v4
        with:
          name: csgo-demo-extract-windows
          path: tools/csgo-demo-extract/csgo-demo-extract.exe
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend tests
    runs-on: windows-latest
    timeout-minutes: 45
    needs: extractor
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: csgo-demo-extract-windows
          path: tools/csgo-demo-extract

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Verify CS:GO demo extractor runtime
        run: uv run --frozen python -m app.demoparser_runtime

      - name: Run backend tests
        run: uv run --frozen python -m pytest backend/tests -q

  frontend:
    name: Frontend tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n catalogs
        run: pnpm run check:i18n

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  rust:
    name: Rust checks
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Run lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked
